services:
  db:
    build: ./docker/postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-url_shortener}
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD:?set AUTHENTICATOR_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # During first-run init Postgres listens on a Unix socket only, so a TCP
      # check passes only after every script in ./db has run.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgrest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@db:5432/${POSTGRES_DB:-url_shortener}
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_PRE_REQUEST: public.authenticate
    # No published port: clients go through OpenResty, which applies rate limits.

  openresty:
    build: ./docker/openresty
    restart: unless-stopped
    depends_on:
      - postgrest
    environment:
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60}
      LINK_CACHE_SECONDS: ${LINK_CACHE_SECONDS:-60}
      LINK_NEGATIVE_CACHE_SECONDS: ${LINK_NEGATIVE_CACHE_SECONDS:-10}
      CLICK_FLUSH_SECONDS: ${CLICK_FLUSH_SECONDS:-1}
      CLICK_BUFFER: ${CLICK_BUFFER:-200000}
      CLICK_RETENTION_DAYS: ${CLICK_RETENTION_DAYS:-90}
      LOOKUP_CONCURRENCY: ${LOOKUP_CONCURRENCY:-10}
      LINK_CACHE_MB: ${LINK_CACHE_MB:-32}
      LINK_MISS_CACHE_MB: ${LINK_MISS_CACHE_MB:-8}
      WORKER_PROCESSES: ${WORKER_PROCESSES:-auto}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      LOG_LEVEL: ${LOG_LEVEL:-notice}
      ACCESS_LOG: ${ACCESS_LOG:-/dev/stdout}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-*}
    ports:
      - "${PORT:-8001}:80"

volumes:
  postgres_data:
