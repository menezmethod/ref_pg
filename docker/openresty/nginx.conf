worker_processes auto;
error_log /dev/stderr ${LOG_LEVEL};
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 16k;

    # ${RATE_LIMIT_PER_MIN} is computed by docker-entrypoint.sh.
    # ponytail: keyed on the TCP peer. Behind a reverse proxy (Coolify, Traefik)
    # every client shares the proxy's IP; add set_real_ip_from + real_ip_header then.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=${RATE_LIMIT_PER_MIN}r/m;
    limit_req_zone $binary_remote_addr zone=redirect_limit:10m rate=${RATE_LIMIT_PER_MIN}r/m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Access-Control-Allow-Origin "${CORS_ALLOW_ORIGIN}" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, X-API-Key" always;

    server {
        listen 80;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "OK";
        }

        location = / {
            default_type text/plain;
            return 200 "ref_pg URL shortener. API: POST /api/rpc/create_short_link\n";
        }

        # Only OpenResty may record clicks; block direct calls from clients.
        location = /api/rpc/resolve_link {
            return 404;
        }

        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;
            if ($request_method = OPTIONS) {
                return 204;
            }
            proxy_hide_header Access-Control-Allow-Origin;  # nginx sets it; browsers reject two
            proxy_pass http://postgrest:3000/;
        }

        location ~ "^/r/([A-Za-z0-9]{3,32})$" {
            limit_req zone=redirect_limit burst=20 nodelay;
            set $code $1;
            content_by_lua_block {
                local cjson = require "cjson.safe"
                local res = ngx.location.capture("/_resolve", {
                    method = ngx.HTTP_POST,
                    body = cjson.encode({
                        p_code = ngx.var.code,
                        p_referrer = ngx.var.http_referer,
                        p_user_agent = ngx.var.http_user_agent,
                        p_ip = ngx.var.remote_addr,
                    }),
                })
                if res.status ~= 200 then
                    ngx.log(ngx.ERR, "resolve_link failed: ", res.status, " ", res.body)
                    return ngx.exit(ngx.HTTP_BAD_GATEWAY)
                end
                -- PostgREST returns a JSON string for a hit and null for a miss.
                local url = cjson.decode(res.body)
                if type(url) ~= "string" then
                    return ngx.exit(ngx.HTTP_NOT_FOUND)
                end
                ngx.header["Cache-Control"] = "no-store"  -- so every click reaches us
                return ngx.redirect(url, ngx.HTTP_MOVED_TEMPORARILY)
            }
        }

        location = /_resolve {
            internal;
            proxy_pass_request_headers off;
            proxy_set_header Content-Type application/json;
            proxy_set_header Accept application/json;
            proxy_pass http://postgrest:3000/rpc/resolve_link;
        }
    }
}
