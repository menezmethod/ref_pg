worker_processes auto;
error_log /dev/stderr ${LOG_LEVEL};
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;
    access_log ${ACCESS_LOG};

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 16k;
    resolver 127.0.0.11 ipv6=off;  # Docker DNS, for the click flusher's cosocket

    # set_real_ip_from lines rendered from TRUSTED_PROXIES by docker-entrypoint.sh.
    # With none, $remote_addr is the TCP peer.
    include /usr/local/openresty/nginx/conf/real_ip.conf;

    # Computed by docker-entrypoint.sh. The key is $binary_remote_addr, or ""
    # when limiting is off (nginx does not count requests with an empty key).
    limit_req_zone ${RATE_LIMIT_KEY} zone=api_limit:10m rate=${RATE_LIMIT_PER_MIN}r/m;
    limit_req_zone ${RATE_LIMIT_KEY} zone=redirect_limit:10m rate=${RATE_LIMIT_PER_MIN}r/m;

    # code -> URL ("" caches a miss). Shared by all workers.
    lua_shared_dict links 32m;
    # Clicks waiting to be written. ponytail: in memory, so a crash loses up to
    # one flush interval of clicks; analytics can live with that.
    lua_shared_dict click_queue 64m;
    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";

    init_worker_by_lua_block {
        require("clicks").start(${CLICK_FLUSH_SECONDS})
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Access-Control-Allow-Origin "${CORS_ALLOW_ORIGIN}" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, X-API-Key" always;

    server {
        listen 80;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "OK";
        }

        location = / {
            default_type text/plain;
            return 200 "ref_pg URL shortener. API: POST /api/rpc/create_short_link\n";
        }

        # Cross-tenant functions for OpenResty only.
        location ^~ /api/rpc/internal_ {
            return 404;
        }

        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;
            if ($request_method = OPTIONS) {
                return 204;
            }
            proxy_hide_header Access-Control-Allow-Origin;  # nginx sets it; browsers reject two
            proxy_pass http://postgrest:3000/;
        }

        location ~ "^/r/([A-Za-z0-9]{3,32})$" {
            limit_req zone=redirect_limit burst=20 nodelay;
            set $code $1;
            content_by_lua_block {
                local cjson = require "cjson.safe"
                local links = ngx.shared.links
                local code = ngx.var.code

                local url = links:get(code)
                if url == nil then
                    local res = ngx.location.capture("/_lookup", {
                        method = ngx.HTTP_POST,
                        body = cjson.encode({ p_code = code }),
                    })
                    if res.status ~= 200 then
                        ngx.log(ngx.ERR, "internal_lookup_link failed: ", res.status, " ", res.body)
                        return ngx.exit(ngx.HTTP_BAD_GATEWAY)
                    end
                    -- PostgREST returns a JSON string for a hit and null for a miss.
                    url = cjson.decode(res.body)
                    if type(url) ~= "string" then url = "" end
                    -- A takedown (is_active = false) shows up once the entry expires.
                    local ttl = url == "" and ${LINK_NEGATIVE_CACHE_SECONDS} or ${LINK_CACHE_SECONDS}
                    if ttl > 0 then links:set(code, url, ttl) end  -- 0 means "never expire" to ngx.shared
                end
                if url == "" then
                    return ngx.exit(ngx.HTTP_NOT_FOUND)
                end

                require("clicks").push(code, ngx.var.http_referer, ngx.var.http_user_agent, ngx.var.remote_addr)
                ngx.header["Cache-Control"] = "no-store"  -- so every click reaches us
                return ngx.redirect(url, ngx.HTTP_MOVED_TEMPORARILY)
            }
        }

        location = /_lookup {
            internal;
            proxy_pass_request_headers off;
            proxy_set_header Content-Type application/json;
            proxy_set_header Accept application/json;
            proxy_pass http://postgrest:3000/rpc/internal_lookup_link;
        }
    }
}
