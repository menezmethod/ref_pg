worker_processes ${WORKER_PROCESSES};
error_log /dev/stderr ${LOG_LEVEL};
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;
    access_log ${ACCESS_LOG};

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 16k;
    resolver 127.0.0.11 ipv6=off;  # Docker DNS, for the click flusher's cosocket

    # set_real_ip_from lines rendered from TRUSTED_PROXIES by docker-entrypoint.sh.
    # With none, $remote_addr is the TCP peer.
    include /usr/local/openresty/nginx/conf/real_ip.conf;

    # Computed by docker-entrypoint.sh. The key is $binary_remote_addr, or ""
    # when limiting is off (nginx does not count requests with an empty key).
    limit_req_zone ${RATE_LIMIT_KEY} zone=api_limit:10m rate=${RATE_LIMIT_PER_MIN}r/m;
    limit_req_zone ${RATE_LIMIT_KEY} zone=redirect_limit:10m rate=${RATE_LIMIT_PER_MIN}r/m;

    # code -> URL ("" caches a miss), shared by all workers. Holds about 130,000
    # links with 60-character URLs; when full, the least recently used go first.
    lua_shared_dict links ${LINK_CACHE_MB}m;
    # Unknown codes, kept apart so a scan of random codes cannot evict real links.
    lua_shared_dict link_misses ${LINK_MISS_CACHE_MB}m;
    lua_shared_dict link_locks 1m;  # one refresh per expired code (lua/links.lua)
    # Clicks wait in a Lua table per worker (lua/clicks.lua), not shared memory.
    # ponytail: in memory, so a crash loses up to one flush interval of clicks.
    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";

    init_worker_by_lua_block {
        require("clicks").start(${CLICK_FLUSH_SECONDS}, ${CLICK_BUFFER})
        require("links").start(${LOOKUP_CONCURRENCY})
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Access-Control-Allow-Origin "${CORS_ALLOW_ORIGIN}" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, X-API-Key" always;

    server {
        listen 80;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "OK";
        }

        location = / {
            default_type text/plain;
            return 200 "ref_pg URL shortener. API: POST /api/rpc/create_short_link\n";
        }

        # Cross-tenant functions for OpenResty only.
        location ^~ /api/rpc/internal_ {
            return 404;
        }

        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;
            if ($request_method = OPTIONS) {
                return 204;
            }
            proxy_hide_header Access-Control-Allow-Origin;  # nginx sets it; browsers reject two
            proxy_pass http://postgrest:3000/;
        }

        location ~ "^/r/([A-Za-z0-9]{3,32})$" {
            limit_req zone=redirect_limit burst=20 nodelay;
            set $code $1;
            content_by_lua_block {
                local code = ngx.var.code
                local links = require("links")
                local url = links.resolve(code, ${LINK_CACHE_SECONDS}, ${LINK_NEGATIVE_CACHE_SECONDS})
                if url == links.BUSY then
                    ngx.header["Retry-After"] = "1"
                    return ngx.exit(ngx.HTTP_SERVICE_UNAVAILABLE)  -- shed: too many lookups waiting on Postgres
                end
                if url == nil then
                    return ngx.exit(ngx.HTTP_BAD_GATEWAY)  -- Postgres down and nothing cached
                end
                if url == "" then
                    return ngx.exit(ngx.HTTP_NOT_FOUND)
                end

                require("clicks").push(code, ngx.var.http_referer, ngx.var.http_user_agent, ngx.var.remote_addr)
                ngx.header["Cache-Control"] = "no-store"  -- so every click reaches us
                return ngx.redirect(url, ngx.HTTP_MOVED_TEMPORARILY)
            }
        }

        location = /_lookup {
            internal;
            # Fail fast when Postgres stalls: links.lua then serves the old URL, or
            # 502 for a code it has never seen. (nginx defaults to 60 s.)
            proxy_connect_timeout 1s;
            proxy_send_timeout 2s;
            proxy_read_timeout 2s;
            proxy_pass_request_headers off;
            proxy_set_header Content-Type application/json;
            proxy_set_header Accept application/json;
            proxy_pass http://postgrest:3000/rpc/internal_lookup_link;
        }
    }
}
